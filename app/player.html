<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Playing</title>
    <style>
      /* A floating control, not a document: no scrollbars, no selection, and
         the whole surface is draggable except the buttons themselves. */
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: transparent; user-select: none; cursor: default;
      }
      #bar {
        display: flex; align-items: center;
        height: calc(100% - 8px); margin: 3px 4px 5px;
        box-sizing: border-box; position: relative; overflow: hidden;
        background:
          radial-gradient(120% 90% at 50% -25%, rgba(255,255,255,.24), transparent 58%),
          linear-gradient(180deg, rgba(47,49,55,.76), rgba(20,21,25,.82));
        border: 1px solid rgba(255,255,255,.22);
        border-radius: 21px;
        box-shadow:
          0 7px 16px rgba(0,0,0,.42),
          0 2px 4px rgba(0,0,0,.38),
          inset 0 1px 0 rgba(255,255,255,.30),
          inset 0 -1px 0 rgba(0,0,0,.40);
        -webkit-backdrop-filter: blur(28px) saturate(165%);
        font: 15px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      #bar::before {
        content: ""; position: absolute; pointer-events: none; z-index: 2;
        left: 12px; right: 12px; top: 1px; height: 1px;
        border-radius: 50%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.58), transparent);
      }
      #bar::after {
        content: ""; position: absolute; pointer-events: none;
        inset: 0; border-radius: inherit;
        box-shadow: inset 8px 0 14px rgba(89,184,255,.035), inset -8px 0 14px rgba(255,95,86,.035);
      }
      button {
        flex: 1; height: 100%; border: 0; background: transparent; z-index: 1;
        color: rgba(255,255,255,0.95); font-size: 15px; cursor: pointer;
        text-shadow: 0 1px 1px rgba(0,0,0,.8);
        transition: transform 120ms ease, background 120ms ease, color 120ms ease, box-shadow 120ms ease;
      }
      button:hover {
        background: radial-gradient(circle at 50% 15%, rgba(255,255,255,.18), rgba(255,255,255,.045) 70%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
        transform: translateY(-1px);
      }
      button:active {
        background: rgba(0,0,0,.16);
        box-shadow: inset 0 2px 5px rgba(0,0,0,.48);
        transform: translateY(1px);
      }
      #toggle { border-radius: 20px 0 0 20px; }
      #stop { border-radius: 0 20px 20px 0; }
      #toggle { color: #68c2ff; }
      #stop { color: rgba(255,255,255,0.68); font-size: 22px; font-weight: 300; }
      #stop:hover { color: #ff6b65; }
      /* Recording is a distinct state, not a variant of playing: the controls
         do not apply, so they are replaced rather than restyled. */
      #rec { display: none; flex: 1; align-items: center; justify-content: center;
             align-self: stretch; gap: 8px; color: #fff; font-size: 12.5px; z-index: 1;
             text-shadow: 0 1px 1px rgba(0,0,0,.85); }
      body.recording #bar {
        box-shadow: 0 7px 18px rgba(0,0,0,.44), 0 0 14px rgba(255,95,86,.13),
                    inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(0,0,0,.40);
      }
      #rec .mic { width: 17px; height: 17px; color: #ff625b; overflow: visible; }
      #rec .pulse { transform-origin: center; animation: pulse 1.15s ease-out infinite; }
      body.starting #rec .mic { color: #f3b84b; }
      @keyframes pulse {
        0% { opacity: .75; transform: scale(.82) }
        70%,100% { opacity: 0; transform: scale(1.45) }
      }
      @media (prefers-reduced-motion: reduce) { #rec .pulse { animation: none; opacity: 0; } }
      body.recording #toggle, body.recording #sep, body.recording #stop,
      body.starting #toggle, body.starting #sep, body.starting #stop,
      body.transcribing #toggle, body.transcribing #sep, body.transcribing #stop { display: none; }
      body.recording #rec, body.starting #rec, body.transcribing #rec { display: flex; }
      /* Transcribing is NOT recording: the mic is already closed, so the red
         "live" dot would be a lie. Swap to a neutral working indicator. */
      body.transcribing #rec .mic { color: #59b8ff; }
      body.transcribing #rec .pulse { display: none; }
      #notice { display: none; flex: 1; min-width: 0; align-items: center;
                gap: 8px; padding: 0 9px; z-index: 1; color: #fff;
                font-size: 12.5px; text-shadow: 0 1px 1px rgba(0,0,0,.85); }
      #notice .notice-icon { flex: 0 0 auto; width: 18px; height: 18px;
                             color: #f4b84a; filter: drop-shadow(0 0 5px rgba(244,184,74,.22)); }
      #notice-label { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      body.notice #toggle, body.notice #sep, body.notice #stop, body.notice #rec { display: none; }
      body.notice #notice { display: flex; }
      body.notice #bar {
        box-shadow: 0 7px 18px rgba(0,0,0,.44), 0 0 14px rgba(244,184,74,.10),
                    inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(0,0,0,.40);
      }
      #sep { width: 1px; height: 20px; background: rgba(255,255,255,0.18); }
      /* Drag handles flank the buttons so the panel can be moved without a
         title bar, while clicks on the controls still register. */
      .grip { width: 12px; height: 100%; -webkit-app-region: drag; }
    </style>
  </head>
  <body>
    <div id="bar">
      <div class="grip"></div>
      <button id="toggle" title="Pause / resume">❙❙</button>
      <div id="sep"></div>
      <button id="stop" title="Stop speaking" aria-label="Stop speaking">×</button>
      <div id="rec" role="status" aria-live="polite">
        <svg class="mic" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle class="pulse" cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.5"/>
          <rect x="9" y="3.5" width="6" height="11" rx="3" fill="currentColor"/>
          <path d="M6.8 11.5a5.2 5.2 0 0 0 10.4 0M12 16.7V21M9 21h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span id="rec-label">Listening…</span>
      </div>
      <div id="notice" role="alert">
        <svg class="notice-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 7.5v5.2M12 16.3v.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="notice-label">Nothing selected</span>
      </div>
      <div class="grip"></div>
    </div>
    <script type="module">
      import { invoke } from "@tauri-apps/api/core";
      import { listen } from "@tauri-apps/api/event";

      const label = document.getElementById("rec-label");
      let previousMode = "playing";
      let audioContext;

      async function cue(kind) {
        const prefs = await invoke("get_prefs");
        if (prefs.cue_enabled === false) return;
        const volume = Math.max(0, Math.min(1, Number(prefs.cue_volume ?? .22)));
        if (!volume) return;
        audioContext ||= new AudioContext();
        await audioContext.resume();
        const now = audioContext.currentTime;
        const note = (start, end, delay, duration, strength = 1) => {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = kind === "start" ? "triangle" : "sine";
          oscillator.frequency.setValueAtTime(start, now + delay);
          oscillator.frequency.exponentialRampToValueAtTime(end, now + delay + duration);
          gain.gain.setValueAtTime(.0001, now + delay);
          gain.gain.exponentialRampToValueAtTime(volume * .16 * strength, now + delay + .008);
          gain.gain.exponentialRampToValueAtTime(.0001, now + delay + duration);
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start(now + delay);
          oscillator.stop(now + delay + duration + .01);
        };
        if (kind === "start") note(1100, 720, 0, .045, .62);
        if (kind === "processing") note(540, 330, 0, .14, .72);
        if (kind === "warning") {
          note(260, 225, 0, .09, .52);
          note(220, 185, .105, .11, .48);
        }
      }

      const applyMode = (mode) => {
        document.body.classList.remove("notice");
        document.body.classList.toggle("recording", mode === "recording");
        document.body.classList.toggle("starting", mode === "starting");
        document.body.classList.toggle("transcribing", mode === "transcribing");
        if (label) {
          label.textContent = mode === "transcribing" ? "Transcribing…" : mode === "starting" ? "Opening mic…" : "Listening…";
        }
        if (mode !== previousMode) {
          if (mode === "recording") void cue("start");
          if (mode === "transcribing") void cue("processing");
          previousMode = mode;
        }
      };
      window.__kokoroSetPlayerMode = applyMode;
      window.__kokoroShowNotice = (message) => {
        document.body.className = "notice";
        document.getElementById("notice-label").textContent = message;
        void cue("warning");
      };
      listen("player-mode", (e) => {
        applyMode(e.payload);
      });

      // The first mode event can arrive before this hidden window finishes
      // loading. Recover from that race by asking the authoritative session.
      invoke("dictation_status").then((session) => {
        const state = String(session.state || "").toLowerCase();
        if (["starting", "recording", "transcribing"].includes(state)) {
          applyMode(state);
        }
      });

      const toggle = document.getElementById("toggle");

      toggle.addEventListener("click", async () => {
        // The engine owns the truth about paused/playing; ask it rather than
        // tracking a duplicate copy of that state here.
        const state = await invoke("toggle_playback");
        toggle.textContent = state === "paused" ? "▶" : "❙❙";
      });

      document.getElementById("stop").addEventListener("click", () => {
        invoke("stop_speaking");
      });
    </script>
  </body>
</html>
