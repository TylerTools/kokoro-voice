<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Playing</title>
    <style>
      /* A floating control, not a document: no scrollbars, no selection, and
         the whole surface is draggable except the buttons themselves. */
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: transparent; user-select: none; cursor: default;
      }
      #bar {
        display: flex; align-items: center; height: 100%;
        background: rgba(30, 30, 33, 0.94);
        border-radius: 10px;
        -webkit-backdrop-filter: blur(12px);
        font: 15px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      button {
        flex: 1; height: 100%; border: 0; background: transparent;
        color: rgba(255,255,255,0.95); font-size: 15px; cursor: pointer;
      }
      button:hover { background: rgba(255,255,255,0.08); }
      button:active { background: rgba(255,255,255,0.15); }
      #toggle { color: #59b8ff; }
      /* Recording is a distinct state, not a variant of playing: the controls
         do not apply, so they are replaced rather than restyled. */
      #rec { display: none; flex: 1; align-items: center; justify-content: center;
             gap: 8px; color: #fff; font-size: 12.5px; }
      #rec .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff5f56;
                  animation: blink 1.1s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0.25 } }
      @media (prefers-reduced-motion: reduce) { #rec .dot { animation: none } }
      body.recording #toggle, body.recording #sep, body.recording #stop,
      body.transcribing #toggle, body.transcribing #sep, body.transcribing #stop { display: none; }
      body.recording #rec, body.transcribing #rec { display: flex; }
      /* Transcribing is NOT recording: the mic is already closed, so the red
         "live" dot would be a lie. Swap to a neutral working indicator. */
      body.transcribing #rec .dot { background: #59b8ff; }
      #sep { width: 1px; height: 20px; background: rgba(255,255,255,0.18); }
      /* Drag handles flank the buttons so the panel can be moved without a
         title bar, while clicks on the controls still register. */
      .grip { width: 12px; height: 100%; -webkit-app-region: drag; }
    </style>
  </head>
  <body>
    <div id="bar">
      <div class="grip"></div>
      <button id="toggle" title="Pause / resume">❙❙</button>
      <div id="sep"></div>
      <button id="stop" title="Stop">■</button>
      <div id="rec"><span class="dot"></span><span id="rec-label">Listening…</span></div>
      <div class="grip"></div>
    </div>
    <script type="module">
      import { invoke } from "@tauri-apps/api/core";
      import { listen } from "@tauri-apps/api/event";

      const label = document.getElementById("rec-label");
      listen("player-mode", (e) => {
        const mode = e.payload;
        document.body.classList.toggle("recording", mode === "recording");
        document.body.classList.toggle("transcribing", mode === "transcribing");
        if (label) {
          label.textContent = mode === "transcribing" ? "Transcribing…" : "Listening…";
        }
      });

      const toggle = document.getElementById("toggle");

      toggle.addEventListener("click", async () => {
        // The engine owns the truth about paused/playing; ask it rather than
        // tracking a duplicate copy of that state here.
        const state = await invoke("toggle_playback");
        toggle.textContent = state === "paused" ? "▶" : "❙❙";
      });

      document.getElementById("stop").addEventListener("click", () => {
        invoke("stop_speaking");
      });
    </script>
  </body>
</html>
