name: Paired signed release draft

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag or commit to build
        required: true
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: paired-release-${{ inputs.release_ref || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      revision: ${{ steps.metadata.outputs.revision }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - id: metadata
        name: Resolve one version and immutable revision
        shell: bash
        env:
          HEREWORD_UPDATE_PUBLIC_KEY: ${{ vars.HEREWORD_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pinned = json.loads(Path('app/src-tauri/tauri.conf.json').read_text())['plugins']['updater']['pubkey']
          if not pinned or pinned != os.environ.get('HEREWORD_UPDATE_PUBLIC_KEY', '').strip():
              raise SystemExit('The repository updater public key must match HEREWORD_UPDATE_PUBLIC_KEY.')
          PY
          revision="$(git rev-parse HEAD)"
          version="$(python3 scripts/release/verify_version_sync.py)"
          tag="v${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Pushed tag ${GITHUB_REF_NAME} does not match app version ${tag}" >&2
            exit 1
          fi
          python3 scripts/release/verify_version_sync.py --tag "${tag}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - id: release
        name: Create or verify private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_SHA: ${{ steps.metadata.outputs.revision }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [[ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "${RELEASE_TAG} already exists and is not a draft" >&2
              exit 1
            fi
          else
            gh release create "${RELEASE_TAG}" \
              --target "${RELEASE_SHA}" \
              --title "HereWord ${RELEASE_TAG}" \
              --notes "Paired macOS and Windows release candidate. Publication requires physical acceptance." \
              --draft \
              --prerelease
          fi
          release_id="$(gh release view "${RELEASE_TAG}" --json databaseId --jq .databaseId)"
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"

  macos:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      HEREWORD_BUILD_REVISION: ${{ needs.prepare.outputs.revision }}
      HEREWORD_UPDATE_PUBLIC_KEY: ${{ vars.HEREWORD_UPDATE_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Require Apple release credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            HEREWORD_UPDATE_PUBLIC_KEY \
            TAURI_SIGNING_PRIVATE_KEY
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HEREWORD_BUILD_REVISION: ${{ needs.prepare.outputs.revision }}
        with:
          projectPath: app
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: false
          args: --target aarch64-apple-darwin --config src-tauri/tauri.updater-release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: macos-update
          if-no-files-found: error
          path: |
            app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
      - name: Verify signed microphone entitlement
        shell: bash
        run: |
          shopt -s nullglob
          app_bundles=(app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app)
          if [[ ${#app_bundles[@]} -ne 1 ]]; then
            echo "Expected exactly one app bundle; found ${#app_bundles[@]}" >&2
            exit 1
          fi
          entitlement_value="$(codesign -d --entitlements :- "${app_bundles[0]}" 2>/dev/null | plutil -extract 'com\.apple\.security\.device\.audio-input' raw -)"
          if [[ "${entitlement_value}" != "true" ]]; then
            echo "Signed app is missing the audio-input entitlement" >&2
            exit 1
          fi
      - name: Notarize and verify disk image
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          dmg_files=(app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ ${#dmg_files[@]} -ne 1 ]]; then
            echo "Expected exactly one disk image; found ${#dmg_files[@]}" >&2
            exit 1
          fi
          dmg_path="${dmg_files[0]}"
          xcrun notarytool submit "${dmg_path}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${dmg_path}"
          xcrun stapler validate "${dmg_path}"
          spctl -a -vv -t install "${dmg_path}"
      - name: Write and upload notarized macOS manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ ${#dmg_files[@]} -ne 1 ]]; then
            echo "Expected one macOS DMG" >&2
            exit 1
          fi
          python3 scripts/release/write_artifact_manifest.py \
            --platform macos \
            --architecture aarch64 \
            --tag "${RELEASE_TAG}" \
            --revision "${RELEASE_SHA}" \
            --signing-identity "${APPLE_SIGNING_IDENTITY}" \
            --artifact "${dmg_files[0]}" \
            --output HereWord-macos-manifest.json
          gh release upload "${RELEASE_TAG}" \
            "${dmg_files[0]}" \
            HereWord-macos-manifest.json \
            --clobber

  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    environment: windows-release-signing
    env:
      HEREWORD_BUILD_REVISION: ${{ needs.prepare.outputs.revision }}
      HEREWORD_UPDATE_PUBLIC_KEY: ${{ vars.HEREWORD_UPDATE_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      WINDOWS_SIGNING_ENDPOINT: ${{ secrets.WINDOWS_SIGNING_ENDPOINT }}
      WINDOWS_SIGNING_ACCOUNT: ${{ secrets.WINDOWS_SIGNING_ACCOUNT }}
      WINDOWS_SIGNING_PROFILE: ${{ secrets.WINDOWS_SIGNING_PROFILE }}
      WINDOWS_EXPECTED_PUBLISHER: ${{ secrets.WINDOWS_EXPECTED_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Require Windows release credentials
        shell: pwsh
        run: |
          $required = @(
            'AZURE_CLIENT_ID',
            'AZURE_CLIENT_SECRET',
            'AZURE_TENANT_ID',
            'WINDOWS_SIGNING_ENDPOINT',
            'WINDOWS_SIGNING_ACCOUNT',
            'WINDOWS_SIGNING_PROFILE',
            'WINDOWS_EXPECTED_PUBLISHER',
            'HEREWORD_UPDATE_PUBLIC_KEY',
            'TAURI_SIGNING_PRIVATE_KEY'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required release signing setting: $name"
            }
          }
      - name: Install Azure Artifact Signing client
        shell: pwsh
        run: cargo install artifact-signing-cli --locked
      - name: Build signed Windows x64 installer
        working-directory: app
        shell: pwsh
        run: npm run tauri -- build --config src-tauri/tauri.windows-release.conf.json --config src-tauri/tauri.updater-release.conf.json --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-update
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig
      - name: Verify, manifest, and upload Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
        run: |
          $installers = @(Get-ChildItem 'app/src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($installers.Count)"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($signature.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notlike "*$env:WINDOWS_EXPECTED_PUBLISHER*") {
            throw "Unexpected Windows publisher: $($signature.SignerCertificate.Subject)"
          }
          python scripts/release/write_artifact_manifest.py `
            --platform windows `
            --architecture x86_64 `
            --tag $env:RELEASE_TAG `
            --revision $env:RELEASE_SHA `
            --signing-identity $signature.SignerCertificate.Subject `
            --artifact $installers[0].FullName `
            --output HereWord-windows-manifest.json
          gh release upload $env:RELEASE_TAG `
            $installers[0].FullName `
            HereWord-windows-manifest.json `
            --clobber

  verify-draft:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-update'
          merge-multiple: true
          path: update-artifacts
      - name: Download paired manifests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "${RELEASE_TAG}" --pattern 'HereWord-*-manifest.json' --dir release-manifests
      - name: Verify paired identity and preserve draft state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release/verify_paired_manifests.py release-manifests/*.json
          if [[ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "Release must remain a draft until physical acceptance" >&2
            exit 1
          fi
      - name: Write paired updater feed to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release/write_update_manifest.py \
            --version "${RELEASE_VERSION}" --repository "${GITHUB_REPOSITORY}" \
            --artifacts update-artifacts --output latest.json
          gh release upload "${RELEASE_TAG}" update-artifacts/* latest.json --clobber
