name: Signed release

on:
  push:
    tags: ["v*"]

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --target aarch64-apple-darwin
            signing_config: ""
          - os: windows-2022
            args: --target x86_64-pc-windows-msvc
            signing_config: --config src-tauri/tauri.windows-signing.json
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release runner architecture
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test "$(uname -m)" = "arm64"
          else
            test "$(uname -m)" = "x86_64"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Require release signing credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -n "$APPLE_CERTIFICATE"
            test -n "$APPLE_CERTIFICATE_PASSWORD"
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_ID"
            test -n "$APPLE_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test -n "$WINDOWS_CERTIFICATE"
            test -n "$WINDOWS_CERTIFICATE_PASSWORD"
          fi
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'kokoro-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5
          Set-Content app/src-tauri/tauri.windows-signing.json $config
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: Kokoro Voice v__VERSION__
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ matrix.signing_config }}
      - name: Verify macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path=$(find app/src-tauri/target -path '*/release/bundle/macos/*.app' -print -quit)
          dmg_path=$(find app/src-tauri/target -path '*/release/bundle/dmg/*.dmg' -print -quit)
          test -n "$app_path"
          test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          hdiutil verify "$dmg_path"
          shasum -a 256 "$dmg_path" | sed 's#  .*/#  #' > macos-SHA256SUMS.txt
      - name: Verify Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundles = Get-ChildItem app/src-tauri/target -Recurse -File |
            Where-Object {
              $_.Extension -in '.msi', '.exe' -and
              $_.FullName -match '[\\/]release[\\/]bundle[\\/](msi|nsis)[\\/]'
            }
          if (-not $bundles) { throw 'No Windows installer was produced.' }
          foreach ($bundle in $bundles) {
            $signature = Get-AuthenticodeSignature $bundle.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($bundle.Name): $($signature.Status)"
            }
          }
          $bundles | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content windows-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ runner.os }}
          path: '*-SHA256SUMS.txt'
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          merge-multiple: true
      - name: Publish installer checksums to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat macos-SHA256SUMS.txt windows-SHA256SUMS.txt | sort -k2 > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
