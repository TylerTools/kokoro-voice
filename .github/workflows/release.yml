name: Signed release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag or commit to build
        required: true
        type: string
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-14
    # Apple notarization can remain queued for well over an hour.
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Require release signing credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: HereWord v__VERSION__
          releaseDraft: false
          prerelease: true
          args: --target aarch64-apple-darwin
      - name: Verify signed microphone entitlement
        shell: bash
        run: |
          shopt -s nullglob
          app_bundles=(app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app)
          if [[ ${#app_bundles[@]} -ne 1 ]]; then
            echo "Expected exactly one app bundle; found ${#app_bundles[@]}" >&2
            exit 1
          fi
          entitlement_value="$(codesign -d --entitlements :- "${app_bundles[0]}" 2>/dev/null | plutil -extract com.apple.security.device.audio-input raw -)"
          if [[ "$entitlement_value" != "true" ]]; then
            echo "Signed app is missing the audio-input entitlement" >&2
            exit 1
          fi
      - name: Notarize and verify disk image
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          dmg_files=(app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ ${#dmg_files[@]} -ne 1 ]]; then
            echo "Expected exactly one disk image; found ${#dmg_files[@]}" >&2
            exit 1
          fi

          dmg_path="${dmg_files[0]}"
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl -a -vv -t install "$dmg_path"
      - name: Replace release disk image with notarized copy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          dmg_files=(app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          release_version="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          gh release upload "v${release_version}" "${dmg_files[0]}" --clobber
