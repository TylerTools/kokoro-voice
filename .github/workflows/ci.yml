name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner architecture
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test "$(uname -m)" = "arm64"
          else
            test "$(uname -m)" = "x86_64"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path app/src-tauri/Cargo.toml -- -D warnings
      - name: Validate platform dependency lock
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            lock=requirements-windows.lock
            platform=x86_64-pc-windows-msvc
          else
            lock=requirements-macos.lock
            platform=aarch64-apple-darwin
          fi
          uv venv --python 3.12
          uv pip install --dry-run --require-hashes --no-deps --python-platform "$platform" -r "$lock"
      - run: uv run --python 3.12 --with fastapi==0.140.0 --with kokoro-onnx==0.5.0 --with numpy==2.4.6 --with soundfile==0.14.0 python -m unittest discover -s tests -v
      - run: uv run --python 3.12 python -m py_compile server.py client/dictate.py client/speak.py client/snip.py
      - name: Reject sensitive diagnostic fields
        shell: bash
        run: |
          if rg -n '"(transcript|clipboard|token_value|audio|selected_text)"' app/src-tauri/src; then
            echo "Potential sensitive diagnostic field found"
            exit 1
          fi
      - name: Build unsigned Windows development installer
        if: runner.os == 'Windows'
        working-directory: app
        run: npm run tauri -- build --bundles nsis
      - name: Record Windows artifact provenance and checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'app/src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$bundle/SHA256SUMS" -Encoding utf8
          # Record the packaged executable itself so an installed copy can
          # be proven to come from this build, not inferred from its path.
          $appExe = Get-Item -LiteralPath 'app/src-tauri/target/release/kokoro-voice-2-1.exe'
          $appHash = (Get-FileHash -LiteralPath $appExe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            build_kind = 'unsigned-development'
            source_commit = (git rev-parse HEAD)
            source_tree = (git rev-parse 'HEAD^{tree}')
            installer = $installer.Name
            bytes = $installer.Length
            sha256 = $hash
            app_executable = $appExe.Name
            app_executable_bytes = $appExe.Length
            app_executable_sha256 = $appHash
          } | ConvertTo-Json | Set-Content -LiteralPath "$bundle/build-info.json" -Encoding utf8
      - name: Upload unsigned Windows development installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-windows-unsigned-${{ github.sha }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/nsis/SHA256SUMS
            app/src-tauri/target/release/bundle/nsis/build-info.json
          if-no-files-found: error
          retention-days: 14
      - name: Build unsigned macOS development installer
        if: runner.os == 'macOS'
        working-directory: app
        run: npm run tauri -- build --bundles app,dmg
      - name: Record macOS artifact provenance and checksums
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle=app/src-tauri/target/release/bundle/dmg
          shopt -s nullglob
          installers=("$bundle"/*.dmg)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "Expected exactly one DMG installer, found ${#installers[@]}"
            exit 1
          fi
          installer="${installers[0]}"
          name="$(basename "$installer")"
          hash="$(shasum -a 256 "$installer" | awk '{print $1}')"
          bytes="$(stat -f%z "$installer")"
          # Record the packaged executable itself so an installed copy can
          # be proven to come from this build, not inferred from its path.
          app_bundles=(app/src-tauri/target/release/bundle/macos/*.app)
          if [[ ${#app_bundles[@]} -ne 1 ]]; then
            echo "Expected exactly one .app bundle, found ${#app_bundles[@]}"
            exit 1
          fi
          # Tauri names this binary from the bundle config, so discover it
          # rather than hardcoding a name that a rename would silently break.
          app_exes=("${app_bundles[0]}"/Contents/MacOS/*)
          if [[ ${#app_exes[@]} -ne 1 ]]; then
            echo "Expected exactly one executable in the .app, found ${#app_exes[@]}"
            exit 1
          fi
          app_exe="${app_exes[0]}"
          app_hash="$(shasum -a 256 "$app_exe" | awk '{print $1}')"
          app_bytes="$(stat -f%z "$app_exe")"
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "$hash  $name" > "$bundle/SHA256SUMS"
          cat > "$bundle/build-info.json" <<EOF
          {
            "build_kind": "unsigned-development",
            "source_commit": "$commit",
            "source_tree": "$tree",
            "installer": "$name",
            "bytes": $bytes,
            "sha256": "$hash",
            "app_executable": "$(basename "$app_exe")",
            "app_executable_bytes": $app_bytes,
            "app_executable_sha256": "$app_hash"
          }
          EOF
      - name: Upload unsigned macOS development installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-macos-unsigned-${{ github.sha }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/dmg/SHA256SUMS
            app/src-tauri/target/release/bundle/dmg/build-info.json
          if-no-files-found: error
          retention-days: 14
