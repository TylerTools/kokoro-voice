name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path app/src-tauri/Cargo.toml -- -D warnings
      - run: uv run --python 3.12 --with fastapi --with kokoro-onnx --with numpy --with soundfile python -m unittest discover -s tests -v
      - run: uv run --python 3.12 python -m py_compile server.py client/dictate.py client/speak.py client/snip.py
      - name: Reject sensitive diagnostic fields
        shell: bash
        run: |
          if rg -n '"(transcript|clipboard|token_value|audio|selected_text)"' app/src-tauri/src; then
            echo "Potential sensitive diagnostic field found"
            exit 1
          fi
