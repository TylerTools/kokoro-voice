name: Notarize existing release DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose DMG should be notarized
        required: true
        type: string

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Require notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done
      - name: Download release disk image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' \
            --dir release-assets
      - name: Notarize and verify disk image
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          dmg_files=(release-assets/*.dmg)
          if [[ ${#dmg_files[@]} -ne 1 ]]; then
            echo "Expected exactly one disk image; found ${#dmg_files[@]}" >&2
            exit 1
          fi

          dmg_path="${dmg_files[0]}"
          codesign --verify --strict --verbose=2 "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl -a -vv -t install "$dmg_path"
      - name: Replace release disk image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          dmg_files=(release-assets/*.dmg)
          gh release upload "$RELEASE_TAG" "${dmg_files[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
